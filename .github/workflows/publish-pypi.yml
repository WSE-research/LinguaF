# Build and publish LinguaF to PyPI on a version tag.
# Uses PyPI Trusted Publishing (OIDC) — no API token secret required, but you must
# register this repo+workflow as a trusted publisher once at
#   https://pypi.org/manage/project/linguaf/settings/publishing/
# The publish job runs only after the test job passes, so a release is gated on tests.
name: Publish to PyPI

on:
  push:
    tags: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests -m "not e2e" --cov=linguaf --cov-fail-under=85

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
